[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "talk-as-guru"
version = "0.2.1"
description = "CLI utility for analyzing CLAUDE.md files and generating structured prompts for Claude Code"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Grigorii Zhovtun"}
]
keywords = ["cli", "claude", "ai", "prompts", "code-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
]

dependencies = [
    "rich>=13.0.0",
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
guru = "guru.cli:run"

[project.urls]
Homepage = "https://github.com/grigory-zhovtun/talk-as-guru"
Repository = "https://github.com/grigory-zhovtun/talk-as-guru"
Issues = "https://github.com/grigory-zhovtun/talk-as-guru/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
